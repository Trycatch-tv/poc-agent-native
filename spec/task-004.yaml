id: KAN-POC-004
version: 1
title: Motor de cálculo comercial con WebAssembly Component Model y contrato WIT
description: >
  Implementar el cálculo de órdenes de compra comerciales utilizando la Semantic IR v0.4
  y conforme al contrato de interfaces estandarizadas en WebAssembly Interface Types (wit/order.wit).
  El componente debe:
  1. Declarar el contrato WIT de paquete kaddo:commercial@0.1.0 y world order-processor.
  2. Implementar la interfaz exportada order-calculator (calculate-order).
  3. Declarar e invocar capacidades de host (kv-get, check-credit, emit-audit).
  4. Retornar el registro OrderResult estructurado y auditar eventos deterministas.

wit_contract:
  package: kaddo:commercial@0.1.0
  world: order-processor
  export_interface: order-calculator
  import_interfaces:
    - host-services

capabilities:
  - name: kv_store
    description: Acceso síncrono de solo lectura a parámetros de cliente e inventario.
  - name: credit_service
    description: Validación de límites de crédito comercial en el host.
  - name: audit_log
    description: Registro determinista de eventos de auditoría y trazabilidad en el host.

imports:
  - module: host
    name: kv_get
    capability: kv_store
    wit_interface: host-services
    params:
      - name: key
        type: i32
    returns: i32
    description: Retorna el porcentaje de descuento asignado al customer_id (0 si no existe, o tasa 0..100).

  - module: host
    name: check_credit
    capability: credit_service
    wit_interface: host-services
    params:
      - name: customer_id
        type: i32
      - name: amount
        type: i32
    returns: bool
    description: Retorna true si amount <= límite disponible del cliente; false de lo contrario.

  - module: host
    name: emit_audit
    capability: audit_log
    wit_interface: host-services
    params:
      - name: event_id
        type: i32
      - name: payload
        type: i32
    returns: i32
    description: Emite un evento de auditoría en el host. Retorna 1 si fue registrado exitosamente.

types:
  - name: OrderResult
    fields:
      - name: status_code
        type: i32
      - name: subtotal_cents
        type: i32
      - name: discount_cents
        type: i32
      - name: tax_cents
        type: i32
      - name: shipping_cents
        type: i32
      - name: total_cents
        type: i32

functions:
  - name: calculate_line_item
    export: false
    params:
      - name: unit_price_cents
        type: i32
      - name: quantity
        type: i32
    returns: i32
    requirements:
      - id: LINE-001
        description: Si unit_price_cents < 0 o quantity < 0, retornar -1.
      - id: LINE-002
        description: De lo contrario, retornar unit_price_cents * quantity.

  - name: calculate_tax
    export: false
    params:
      - name: taxable_amount_cents
        type: i32
    returns: i32
    requirements:
      - id: TAX-001
        description: Si taxable_amount_cents < 0, retornar 0.
      - id: TAX-002
        description: De lo contrario, retornar taxable_amount_cents * 10 / 100 (tasa base del 10 % en v1).

  - name: calculate_order
    export: true
    wit_interface: order-calculator
    params:
      - name: customer_id
        type: i32
      - name: price1
        type: i32
      - name: qty1
        type: i32
      - name: price2
        type: i32
      - name: qty2
        type: i32
      - name: shipping_cents
        type: i32
    returns: OrderResult
    requirements:
      - id: WIT-001
        description: Implementar y exportar la función calculate-order de la interfaz order-calculator conforme al contrato WIT.
      - id: ORD-001
        description: Validar líneas. Si alguna línea es < 0, retornar OrderResult con status_code = 1 y montos en 0.
      - id: ORD-002
        description: Validar envío. Si shipping_cents < 0, retornar OrderResult con status_code = 2 y montos en 0.
      - id: ORD-003
        description: Consultar descuento invocando kv_get(customer_id). discount_cents = subtotal_cents * discount_rate / 100.
      - id: ORD-004
        description: Base imponible = subtotal_cents - discount_cents. tax_cents = calculate_tax(base_imponible).
      - id: ORD-005
        description: total_cents = base_imponible + tax_cents + shipping_cents.
      - id: ORD-006
        description: Si check_credit es válido: emitir emit_audit(100, total_cents) y retornar OrderResult con status_code = 0.
      - id: ORD-007
        description: Si check_credit(customer_id, total_cents) retorna 0 (crédito insuficiente), retornar OrderResult con status_code = 3 y montos en 0 sin emitir auditoría.
