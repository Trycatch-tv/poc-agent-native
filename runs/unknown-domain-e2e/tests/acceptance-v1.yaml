cases:
  - id: "LOCK-TC-001"
    requirement: "LOCK-001"
    function: "evaluate_lock_transit"
    args: [0, 300, 100]
    host_state:
      kv:
        200: 40
    expected:
      status_code: 1
      flow_index: 0
      ballast_fee: 0
    expected_host_calls: []

  - id: "LOCK-TC-002"
    requirement: "LOCK-001"
    function: "evaluate_lock_transit"
    args: [250, 200, 100]
    host_state:
      kv:
        250: 50
    expected:
      status_code: 1
      flow_index: 0
      ballast_fee: 0
    expected_host_calls: []

  - id: "LOCK-TC-003"
    requirement: "LOCK-003"
    function: "evaluate_lock_transit"
    args: [200, 300, 100]
    host_state:
      kv:
        200: 40
    expected:
      status_code: 0
      flow_index: 700
      ballast_fee: 640
    expected_host_calls:
      - import: "emit_audit"
        args: [300]

  - id: "LOCK-TC-004"
    requirement: "LOCK-002"
    function: "evaluate_lock_transit"
    args: [250, 450, 150]
    host_state:
      kv:
        250: 50
    expected:
      status_code: 2
      flow_index: 1000
      ballast_fee: 0
    expected_host_calls: []

  - id: "LOCK-TC-005"
    requirement: "HYDRO-001"
    function: "evaluate_lock_transit"
    args: [200, 300, -10]
    host_state:
      kv:
        200: 40
    expected:
      status_code: 2
      flow_index: 0
      ballast_fee: 0
    expected_host_calls: []
