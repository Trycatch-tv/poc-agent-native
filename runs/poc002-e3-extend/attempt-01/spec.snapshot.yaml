id: KAN-POC-002
version: 2
title: Motor modular de cálculo de órdenes comerciales con records, subfunciones y errores de dominio
description: >
  Implementar el cálculo de órdenes de compra comerciales utilizando la Semantic IR v0.2.
  El programa debe descomponer la lógica mediante funciones internas privadas (calculate_line_item, calculate_tax)
  e instanciar y retornar un tipo compuesto OrderCalculation con status_code discriminado.

types:
  - name: OrderCalculation
    fields:
      - name: status_code
        type: i32
      - name: subtotal_cents
        type: i32
      - name: tax_cents
        type: i32
      - name: shipping_cents
        type: i32
      - name: total_cents
        type: i32

functions:
  - name: calculate_line_item
    export: false
    params:
      - name: unit_price_cents
        type: i32
      - name: quantity
        type: i32
    returns: i32
    requirements:
      - id: LINE-001
        description: Si unit_price_cents < 0 o quantity < 0, devolver -1.
      - id: LINE-002
        description: En cualquier otro caso, devolver unit_price_cents * quantity.

  - name: calculate_tax
    export: false
    params:
      - name: subtotal_cents
        type: i32
    returns: i32
    requirements:
      - id: TAX-001
        description: Si subtotal_cents < 0, devolver -1.
      - id: TAX-002
        description: En cualquier otro caso, devolver subtotal_cents * 10 / 100 (tasa estándar del 10 %).

  - name: calculate_order
    export: true
    params:
      - name: price1
        type: i32
      - name: qty1
        type: i32
      - name: price2
        type: i32
      - name: qty2
        type: i32
      - name: shipping_cents
        type: i32
    returns: OrderCalculation
    requirements:
      - id: ORD-001-V2
        description: Si calculate_line_item da -1 para cualquier item, devolver OrderCalculation con status_code = 1 (ERR_INVALID_ITEM) y los demás campos en 0.
      - id: ORD-002-V2
        description: Si shipping_cents < 0, devolver OrderCalculation con status_code = 2 (ERR_INVALID_SHIPPING) y los demás campos en 0.
      - id: ORD-003-V2
        description: Si subtotal_cents + tax_cents > 1000000, devolver OrderCalculation con status_code = 3 (ERR_LIMIT_EXCEEDED) y los demás campos en 0.
      - id: ORD-004-V2
        description: En caso de éxito, devolver status_code = 0 (STATUS_OK), con subtotal_cents, tax_cents, shipping_cents y total_cents (subtotal + tax + shipping).

acceptance:
  public:
    - id: E3-002-P01
      function: calculate_order
      args: [-1, 1, 100, 1, 500]
      expected:
        status_code: 1
        subtotal_cents: 0
        tax_cents: 0
        shipping_cents: 0
        total_cents: 0
    - id: E3-002-P02
      function: calculate_order
      args: [100, 1, 100, -1, 500]
      expected:
        status_code: 1
        subtotal_cents: 0
        tax_cents: 0
        shipping_cents: 0
        total_cents: 0
    - id: E3-002-P03
      function: calculate_order
      args: [100, 1, 100, 1, -50]
      expected:
        status_code: 2
        subtotal_cents: 0
        tax_cents: 0
        shipping_cents: 0
        total_cents: 0
    - id: E3-002-P04
      function: calculate_order
      args: [1000, 2, 500, 1, 500]
      expected:
        status_code: 0
        subtotal_cents: 2500
        tax_cents: 250
        shipping_cents: 500
        total_cents: 3250
    - id: E3-002-P05
      function: calculate_order
      args: [0, 0, 0, 0, 0]
      expected:
        status_code: 0
        subtotal_cents: 0
        tax_cents: 0
        shipping_cents: 0
        total_cents: 0
    - id: E3-002-P06
      function: calculate_order
      args: [5000, 3, 2500, 2, 1000]
      expected:
        status_code: 0
        subtotal_cents: 20000
        tax_cents: 2000
        shipping_cents: 1000
        total_cents: 23000
    - id: E3-002-P07
      function: calculate_order
      args: [500000, 2, 100000, 1, 500]
      expected:
        status_code: 3
        subtotal_cents: 0
        tax_cents: 0
        shipping_cents: 0
        total_cents: 0
    - id: E3-002-P08
      function: calculate_order
      args: [2000000, 1, 0, 0, 100]
      expected:
        status_code: 3
        subtotal_cents: 0
        tax_cents: 0
        shipping_cents: 0
        total_cents: 0
    - id: E3-002-P09
      function: calculate_order
      args: [200, 1, 300, 1, 0]
      expected:
        status_code: 0
        subtotal_cents: 500
        tax_cents: 50
        shipping_cents: 0
        total_cents: 550
    - id: E3-002-P10
      function: calculate_order
      args: [50, 4, 10, 5, 25]
      expected:
        status_code: 0
        subtotal_cents: 250
        tax_cents: 25
        shipping_cents: 25
        total_cents: 300
    - id: E3-002-P11
      function: calculate_order
      args: [-10, -5, 10, 5, 25]
      expected:
        status_code: 1
        subtotal_cents: 0
        tax_cents: 0
        shipping_cents: 0
        total_cents: 0
    - id: E3-002-P12
      function: calculate_order
      args: [100, 2, 100, 2, -1]
      expected:
        status_code: 2
        subtotal_cents: 0
        tax_cents: 0
        shipping_cents: 0
        total_cents: 0
