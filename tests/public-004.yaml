# Suite de pruebas públicas para POC 004 (WebAssembly Component Model & WIT)
# Interfaz: kaddo:commercial/order-calculator
# Exported function: calculate_order (customer_id, price1, qty1, price2, qty2, shipping_cents) -> OrderResult

cases:
  - id: TC-PUB-401
    description: Orden estándar cliente normal sin descuento (kv=0), crédito suficiente
    requirement: ORD-006
    function: calculate_order
    args: [101, 1000, 2, 500, 2, 300]
    host_state:
      kv:
        101: 0
      credit_limits:
        101: 100000
    expected:
      status_code: 0
      subtotal_cents: 3000
      discount_cents: 0
      tax_cents: 300
      shipping_cents: 300
      total_cents: 3600
    expected_host_calls:
      - import: check_credit
        args: [101, 3600]
      - import: emit_audit
        args: [100, 3600]

  - id: TC-PUB-402
    description: Cliente VIP con 10 % descuento (kv=10), crédito suficiente
    requirement: ORD-003
    function: calculate_order
    args: [202, 2000, 1, 1000, 1, 500]
    host_state:
      kv:
        202: 10
      credit_limits:
        202: 500000
    expected:
      status_code: 0
      subtotal_cents: 3000
      discount_cents: 300
      tax_cents: 270
      shipping_cents: 500
      total_cents: 3470
    expected_host_calls:
      - import: check_credit
        args: [202, 3470]
      - import: emit_audit
        args: [100, 3470]

  - id: TC-PUB-403
    description: Línea 1 inválida (precio negativo), debe fallar con status 1 y sin auditoría
    requirement: ORD-001
    function: calculate_order
    args: [303, -100, 2, 500, 1, 200]
    host_state:
      kv:
        303: 0
      credit_limits:
        303: 100000
    expected:
      status_code: 1
      subtotal_cents: 0
      discount_cents: 0
      tax_cents: 0
      shipping_cents: 0
      total_cents: 0
    expected_host_calls: []

  - id: TC-PUB-404
    description: Línea 2 inválida (cantidad negativa), status 1
    requirement: ORD-001
    function: calculate_order
    args: [303, 500, 2, 200, -1, 200]
    host_state:
      kv:
        303: 0
      credit_limits:
        303: 100000
    expected:
      status_code: 1
      subtotal_cents: 0
      discount_cents: 0
      tax_cents: 0
      shipping_cents: 0
      total_cents: 0
    expected_host_calls: []

  - id: TC-PUB-405
    description: Costo de envío inválido (negativo), debe fallar con status 2
    requirement: ORD-002
    function: calculate_order
    args: [404, 1000, 1, 1000, 1, -50]
    host_state:
      kv:
        404: 0
      credit_limits:
        404: 100000
    expected:
      status_code: 2
      subtotal_cents: 0
      discount_cents: 0
      tax_cents: 0
      shipping_cents: 0
      total_cents: 0
    expected_host_calls: []

  - id: TC-PUB-406
    description: Límite de crédito insuficiente (crédito = 2000, total = 3600), status 3 sin auditoría
    requirement: ORD-007
    function: calculate_order
    args: [505, 1500, 2, 0, 0, 300]
    host_state:
      kv:
        505: 0
      credit_limits:
        505: 2000
    expected:
      status_code: 3
      subtotal_cents: 0
      discount_cents: 0
      tax_cents: 0
      shipping_cents: 0
      total_cents: 0
    expected_host_calls:
      - import: check_credit
        args: [505, 3600]

  - id: TC-PUB-407
    description: Cliente mayorista con 20 % descuento (kv=20) y crédito suficiente
    requirement: ORD-004
    function: calculate_order
    args: [606, 2500, 2, 2500, 2, 1000]
    host_state:
      kv:
        606: 20
      credit_limits:
        606: 500000
    expected:
      status_code: 0
      subtotal_cents: 10000
      discount_cents: 2000
      tax_cents: 800
      shipping_cents: 1000
      total_cents: 9800
    expected_host_calls:
      - import: check_credit
        args: [606, 9800]
      - import: emit_audit
        args: [100, 9800]
