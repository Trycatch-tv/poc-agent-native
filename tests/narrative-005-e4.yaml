cases:
  - id: TC-NAR-501-E4
    requirement: SHIP-003
    function: calculate_order
    args: [101, 1000, 2, 500, 2, 1500, 0]
    host_state:
      kv:
        101: 10
      credit_ok: true
    expected:
      status_code: 0
      subtotal_cents: 3000
      discount_cents: 300
      tax_cents: 405
      shipping_cents: 550
      total_cents: 3655
    expected_host_calls:
      - import: check_credit
        args: [101, 3655]
      - import: emit_audit
        args: [100, 3655]

  - id: TC-NAR-502-E4
