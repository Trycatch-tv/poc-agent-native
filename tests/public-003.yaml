suite: KAN-POC-003-PUBLIC
spec_version: 3
cases:
  - id: E1-003-P01
    requirement: ORD-001
    function: calculate_order
    args: [101, -1, 1, 100, 1, 500]
    host_state:
      kv:
        101: 10
      credit_limits:
        101: 10000
    expected:
      status_code: 1
      subtotal_cents: 0
      discount_cents: 0
      tax_cents: 0
      shipping_cents: 0
      total_cents: 0
    expected_host_calls: []

  - id: E1-003-P02
    requirement: ORD-001
    function: calculate_order
    args: [101, 100, 1, 100, -1, 500]
    host_state:
      kv:
        101: 10
      credit_limits:
        101: 10000
    expected:
      status_code: 1
      subtotal_cents: 0
      discount_cents: 0
      tax_cents: 0
      shipping_cents: 0
      total_cents: 0
    expected_host_calls: []

  - id: E1-003-P03
    requirement: ORD-002
    function: calculate_order
    args: [101, 100, 1, 100, 1, -50]
    host_state:
      kv:
        101: 10
      credit_limits:
        101: 10000
    expected:
      status_code: 2
      subtotal_cents: 0
      discount_cents: 0
      tax_cents: 0
      shipping_cents: 0
      total_cents: 0
    expected_host_calls: []

  - id: E1-003-P04
    requirement: ORD-006
    function: calculate_order
    args: [101, 1000, 2, 500, 1, 500]
    host_state:
      kv:
        101: 20
      credit_limits:
        101: 5000
    expected:
      status_code: 0
      subtotal_cents: 2500
      discount_cents: 500
      tax_cents: 240
      shipping_cents: 500
      total_cents: 2740
    expected_host_calls:
      - import: check_credit
        args: [101, 2740]
      - import: emit_audit
        args: [100, 2740]

  - id: E1-003-P05
    requirement: ORD-006
    function: calculate_order
    args: [102, 5000, 1, 0, 0, 0]
    host_state:
      kv:
        102: 0
      credit_limits:
        102: 10000
    expected:
      status_code: 0
      subtotal_cents: 5000
      discount_cents: 0
      tax_cents: 600
      shipping_cents: 0
      total_cents: 5600
    expected_host_calls:
      - import: check_credit
        args: [102, 5600]
      - import: emit_audit
        args: [100, 5600]

  - id: E1-003-P06
    requirement: ORD-006
    function: calculate_order
    args: [103, 10000, 2, 20000, 1, 1000]
    host_state:
      kv:
        103: 50
      credit_limits:
        103: 50000
    expected:
      status_code: 0
      subtotal_cents: 40000
      discount_cents: 20000
      tax_cents: 2400
      shipping_cents: 1000
      total_cents: 23400
    expected_host_calls:
      - import: check_credit
        args: [103, 23400]
      - import: emit_audit
        args: [999, 23400]

  - id: E3-003-P07
    requirement: ORD-007
    function: calculate_order
    args: [104, 1000, 2, 500, 1, 500]
    host_state:
      kv:
        104: 20
      credit_limits:
        104: 1500
    expected:
      status_code: 3
      subtotal_cents: 0
      discount_cents: 0
      tax_cents: 0
      shipping_cents: 0
      total_cents: 0
    expected_host_calls:
      - import: check_credit
        args: [104, 2740]
